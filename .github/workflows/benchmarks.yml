name: Benchmarks
on:
  workflow_dispatch:
    inputs:
      os:
        type: choice
        options: [ubuntu-latest, windows-latest]
        default: ubuntu-latest
      job:
        type: choice
        options: [Dry, short, medium, long]
        default: short

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore UnlimitedPDF.Benchmarks.slnx --locked-mode
      - run: dotnet build UnlimitedPDF.Benchmarks.slnx -c Release --no-restore
      - run: dotnet test UnlimitedPDF.Benchmarks.slnx -c Release --no-build --no-restore
      - name: Benchmark
        env:
          BENCHMARK_JOB: ${{ inputs.job }}
        run: dotnet run --project src/UnlimitedPDF.Benchmarks.Runner -c Release --no-build -- --filter "*EmptyPageBenchmarks*" --job $env:BENCHMARK_JOB
        shell: pwsh
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: benchmark-${{ inputs.os }}-${{ github.run_id }}
          path: BenchmarkDotNet.Artifacts/
          if-no-files-found: warn
