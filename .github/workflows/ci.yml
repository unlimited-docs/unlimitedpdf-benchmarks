name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore UnlimitedPDF.Benchmarks.slnx --locked-mode -p:NuGetAuditMode=all -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904
      - run: dotnet build UnlimitedPDF.Benchmarks.slnx -c Release --no-restore
      - run: dotnet test UnlimitedPDF.Benchmarks.slnx -c Release --no-build --no-restore
      - run: dotnet run --project src/UnlimitedPDF.Benchmarks.Runner -c Release --no-build -- --filter "*EmptyPageBenchmarks*" --job Dry

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/dependency-review-action@v5.0.1
        with:
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Unicode-3.0
