name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Locked restore with vulnerability audit
        run: dotnet restore UnlimitedPDF.Benchmarks.slnx --locked-mode -p:NuGetAuditMode=all -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Vulnerable package check (direct and transitive)
        shell: pwsh
        run: |
          $report = dotnet list UnlimitedPDF.Benchmarks.slnx package --vulnerable --include-transitive 2>&1
          $report
          if ($report -match 'has the following vulnerable packages') { throw 'Vulnerable packages found.' }

      - name: Licence policy
        shell: pwsh
        run: ./scripts/check-licenses.ps1

      - run: dotnet build UnlimitedPDF.Benchmarks.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/UnlimitedPDF.Benchmarks.UnitTests -c Release --no-build --no-restore

      - name: Integration tests (every scenario and library, validated by PDFium)
        run: dotnet test tests/UnlimitedPDF.Benchmarks.IntegrationTests -c Release --no-build --no-restore

      - name: Smoke run (validation, Dry benchmarks, profiler, reports)
        shell: pwsh
        run: ./scripts/run-benchmarks.ps1 -Profile smoke -SkipBuild -Output results/ci-smoke

      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: smoke-${{ matrix.os }}-${{ github.run_id }}
          path: results/ci-smoke/
          if-no-files-found: warn

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/dependency-review-action@v4.8.2
        with:
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Unicode-3.0, OFL-1.1
